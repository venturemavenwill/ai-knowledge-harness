<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">AI Knowledge Harness</title>
  <desc id="description">Portable, evidence-aware capabilities for AI coding agents</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="0.55" stop-color="#102b46"/>
      <stop offset="1" stop-color="#173d4f"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4be1c3"/>
      <stop offset="1" stop-color="#72a7ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <g opacity="0.18" stroke="#9ed7ff" stroke-width="1">
    <path d="M0 54H1200M0 102H1200M0 150H1200M0 198H1200M0 246H1200"/>
    <path d="M80 0V300M160 0V300M240 0V300M320 0V300M400 0V300M480 0V300M560 0V300M640 0V300M720 0V300M800 0V300M880 0V300M960 0V300M1040 0V300M1120 0V300"/>
  </g>
  <g transform="translate(72 54)">
    <g fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
      <path d="M28 96L82 40L142 72L196 22"/>
      <path d="M82 40L94 122L162 148L196 92"/>
      <path d="M142 72L196 92L232 54"/>
    </g>
    <g fill="#d8fff7" stroke="#56d7c5" stroke-width="4">
      <circle cx="28" cy="96" r="11"/>
      <circle cx="82" cy="40" r="13"/>
      <circle cx="94" cy="122" r="10"/>
      <circle cx="142" cy="72" r="14"/>
      <circle cx="162" cy="148" r="11"/>
      <circle cx="196" cy="22" r="9"/>
      <circle cx="196" cy="92" r="13"/>
      <circle cx="232" cy="54" r="10"/>
    </g>
  </g>
  <g fill="#f4fbff" font-family="Segoe UI, Arial, sans-serif">
    <text x="360" y="112" font-size="54" font-weight="700" letter-spacing="2">AI KNOWLEDGE HARNESS</text>
    <text x="363" y="161" font-size="23" fill="#bfe4f5">Portable, evidence-aware capabilities for AI coding agents</text>
    <text x="363" y="210" font-size="18" fill="#69e3cc" letter-spacing="1.5">GIT-BACKED  |  AGENT-AGNOSTIC  |  OPEN SOURCE</text>
  </g>
