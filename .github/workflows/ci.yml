name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate canonical records and projections
        run: python bin/aikb.py validate --projection

      - name: Run unit and adversarial tests
        run: python -m unittest discover -s tests -v

      - name: Verify deterministic replay
        run: python bin/aikb.py refresh --check

      - name: Verify routing surfaces cover every namespace
        run: python scripts/check_routing_coverage.py

      - name: Verify append-only pull request history
        if: github.event_name == 'pull_request'
        run: python scripts/check_append_only.py --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: Detect append-only violations on direct pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python scripts/check_append_only.py --base-ref "${{ github.event.before }}"

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'install/bootstrap.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Parse POSIX installer
        if: runner.os != 'Windows'
        run: sh -n install/bootstrap.sh

      - name: Verify POSIX installer lifecycle
        if: runner.os != 'Windows'
        run: |
          set -eu
          install/bootstrap.sh
          # The installed symlink must reach the CLI inside the checkout.
          "$HOME/.local/bin/aikb" --repo "$PWD" list
          "$HOME/.local/bin/aikb" --repo "$PWD" validate --projection
          install/bootstrap.sh --check
          install/bootstrap.sh --uninstall

      - name: Verify Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install/bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./install/bootstrap.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./install/bootstrap.ps1 -Uninstall
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check whitespace
        run: git diff --check
